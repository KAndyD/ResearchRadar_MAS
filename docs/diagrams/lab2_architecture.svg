<text x="550" y="405" text-anchor="middle" class="t">Каждый исполнитель имеет отдельную очередь, состояние и оценку собственной заявки.</text>
<text x="550" y="434" text-anchor="middle" class="s">Фактический поиск выполняется через общие адаптеры, независимо от механизма назначения.</text>
