<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480">
<defs><style>text{font-family:Arial,sans-serif;fill:#1b2935}.h{font-size:22px;font-weight:bold}.t{font-size:16px}.s{font-size:14px}.b{fill:white;stroke:#31465b;stroke-width:2}.a{fill:none;stroke:#31465b;stroke-width:2;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#31465b"/></marker></defs>
<rect width="1100" height="480" fill="white"/>
<text x="550" y="35" text-anchor="middle" class="h">Общий контур исследования и распределения задач</text>
