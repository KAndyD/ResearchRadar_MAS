<rect x="350" y="83" width="280" height="86" rx="7" class="b"/><text x="490" y="115" text-anchor="middle" class="h">Координатор</text><text x="490" y="143" text-anchor="middle" class="t">выбор политики назначения</text>
<rect x="735" y="83" width="320" height="86" rx="7" class="b"/><text x="895" y="115" text-anchor="middle" class="h">Результат</text><text x="895" y="143" text-anchor="middle" class="t">данные · ошибки · трасса · метрики</text>
<path d="M245 126 H350 M630 126 H735" class="a"/>
<path d="M490 169 V216 H190 V244 M490 216 H490 V244 M490 216 H790 V244" class="a"/>
<rect x="40" y="244" width="300" height="102" rx="7" class="b"/><text x="190" y="277" text-anchor="middle" class="h">Научные исполнители</text><text x="190" y="304" text-anchor="middle" class="t">4 агента, пересекающиеся навыки</text><text x="190" y="328" text-anchor="middle" class="s">OpenAlex · Crossref · arXiv</text>
<rect x="375" y="244" width="230" height="102" rx="7" class="b"/><text x="490" y="277" text-anchor="middle" class="h">Шина сообщений</text><text x="490" y="304" text-anchor="middle" class="t">очереди и полномочия</text><text x="490" y="328" text-anchor="middle" class="s">CFP · заявки · назначения</text>
<rect x="640" y="244" width="300" height="102" rx="7" class="b"/><text x="790" y="277" text-anchor="middle" class="h">Новостные исполнители</text><text x="790" y="304" text-anchor="middle" class="t">2 агента, общая компетенция</text><text x="790" y="328" text-anchor="middle" class="s">Google News RSS · GDELT по выбору</text>
