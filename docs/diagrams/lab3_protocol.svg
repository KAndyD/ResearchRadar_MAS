<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610">
<rect width="1000" height="610" fill="white"/>
<text x="500" y="33" text-anchor="middle" font-family="Arial" font-size="23" fill="#20364c">Два раунда переговоров о кредите проверки</text>
<g font-family="Arial" font-size="17" fill="#20364c" text-anchor="middle"><text x="150" y="70">Проверяющий агент</text><text x="500" y="70">Посредник</text><text x="850" y="70">Ресурсный журнал</text></g>
<g stroke="#c4cdd5" stroke-dasharray="5 6"><line x1="150" y1="84" x2="150" y2="575"/><line x1="500" y1="84" x2="500" y2="575"/><line x1="850" y1="84" x2="850" y2="575"/></g>
<g stroke="#34536f" stroke-width="2"><line x1="155" y1="120" x2="493" y2="120"/><line x1="505" y1="175" x2="157" y2="175"/><line x1="155" y1="230" x2="493" y2="230"/><line x1="505" y1="285" x2="157" y2="285"/><line x1="155" y1="340" x2="493" y2="340"/><line x1="505" y1="395" x2="843" y2="395"/><line x1="505" y1="450" x2="157" y2="450"/><line x1="155" y1="505" x2="493" y2="505"/><line x1="155" y1="555" x2="843" y2="555"/></g>
<g fill="#34536f"><polygon points="495,120 483,114 483,126"/><polygon points="155,175 167,169 167,181"/><polygon points="495,230 483,224 483,236"/><polygon points="155,285 167,279 167,291"/><polygon points="495,340 483,334 483,346"/><polygon points="845,395 833,389 833,401"/><polygon points="155,450 167,444 167,456"/><polygon points="495,505 483,499 483,511"/><polygon points="845,555 833,549 833,561"/></g>
<g font-family="Arial" font-size="14" fill="#22384c" text-anchor="middle"><text x="322" y="110">request: полная проверка</text><text x="322" y="165">offer: доступный объём, раунд 1</text><text x="322" y="220">counter: уступка или частичная проверка</text><text x="322" y="275">offer: пересмотренный объём, раунд 2</text><text x="322" y="330">accept либо reject</text><text x="677" y="385">reserve: атомарно</text><text x="322" y="440">commit: ID соглашения</text><text x="322" y="495">result: выполненная проверка</text><text x="677" y="545">агент: finish и освобождение слота</text></g>
<text x="500" y="600" text-anchor="middle" font-family="Arial" font-size="13" fill="#536576">Молчание или невозможность соглашения ограничивают раунды и вызывают арбитраж либо отказ.</text>
</svg>
