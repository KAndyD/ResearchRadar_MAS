name: tests
on: [push, pull_request]
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m researchradar.cli "multi agent systems" --mode demo
      - run: python -m researchradar.cli_stage2 "multi agent systems" --mode demo --coordination centralized
      - run: python -m researchradar.cli_stage2 "multi agent systems" --mode demo --coordination contract-net
      - run: python tools/run_experiments.py --repeats 1 --output run_output/ci-experiment
      - run: python -m researchradar.cli_stage3 "multi agent systems" --mode demo --resource-policy baseline --output run_output/ci-stage3-baseline.json
      - run: python -m researchradar.cli_stage3 "multi agent systems" --mode demo --resource-policy negotiation --output run_output/ci-stage3-negotiation.json
      - run: python tools/run_negotiation_experiments.py --repeats 1 --output run_output/ci-stage3-experiment
      - run: python tools/verify_lab3_results.py --results run_output/ci-stage3-experiment
      - run: python -m researchradar.cli_stage3 "multi agent systems" --mode demo --resource-policy baseline --credits 4 --slots 1 --output run_output/ci-stage3-slot-conflict.json
      - run: python -m researchradar.cli_stage4 "multi agent systems" --mode demo --analysis recorded --recorded-analysis data/lab4_v1.1_fixture_analysis.json --output run_output/ci-stage4.json
      - run: python tools/run_lab4_experiments.py --repeats 1 --output run_output/ci-stage4-experiment
      - run: python tools/verify_lab4_results.py run_output/ci-stage4-experiment
      - run: python tools/run_lab4_llm_experiments.py --output run_output/ci-stage4-llm
      - run: python tools/verify_lab4_llm_results.py run_output/ci-stage4-llm
      - run: python tools/run_lab4_v1_1_llm_experiments.py --output run_output/ci-stage4-v1-1-llm
      - run: python tools/verify_lab4_v1_1_llm_results.py run_output/ci-stage4-v1-1-llm
      - run: python tools/verify_lab4_v1_1_live.py
